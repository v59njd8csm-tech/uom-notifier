name: Check UoM news

on:
  schedule:
    - cron: "17 5-21/2 * * *"   # κάθε 2 ώρες, 08:17–00:17 ώρα Ελλάδας
  workflow_dispatch:            # κουμπί "Run workflow" για χειροκίνητη εκτέλεση

permissions:
  contents: write               # για να σώζει το seen.json πίσω στο repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py

      - name: Save seen.json
        run: |
          git config user.name "uom-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen announcements"
          git push
